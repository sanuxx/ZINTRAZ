name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Queue deploys rather than cancelling: stopping one mid-build would waste it, and the next one follows anyway.
concurrency:
  group: vps
  cancel-in-progress: false

jobs:
  deploy:
    # Skipped until the VPS_HOST repository variable exists, so pushes before the server is ready don't fail.
    if: vars.VPS_HOST != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Run the deploy script on the server
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          HOST: ${{ vars.VPS_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The key only works for deploy/deploy.sh (see the command= option in authorized_keys on the server).
          ssh -o ServerAliveInterval=30 "zintraz@$HOST" deploy
